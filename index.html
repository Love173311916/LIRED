<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymPal">
<title>GymPal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0f;--bg2:#1c1c1e;--bg3:#2c2c2e;--text:#f0eeeb;--text2:#a0a0a0;--accent:#34C759;--border:#2c2c2e;--card:#1c1c1e;--red:#FF3B30;--blue:#0A84FF;--pink:#FF2D78}
.light{--bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;--text:#000;--text2:#6e6e73;--border:#d1d1d6;--card:#fff}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;transition:background .3s,color .3s}
#profileScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:24px}
.appTitle{font-size:28px;font-weight:700;color:var(--accent)}
.appSub{font-size:14px;color:var(--text2);margin-bottom:16px}
.profiles{display:flex;gap:16px;width:100%;max-width:400px}
.profileCard{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s,transform .1s}
.profileCard:active{transform:scale(0.97)}
.profileCard.selected{border-color:var(--accent)}
.avatarWrap{width:80px;height:80px;border-radius:50%;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;border:2px solid var(--accent)}
.avatarWrap img{width:100%;height:100%;object-fit:cover}
.avatarInitial{font-size:28px;font-weight:600;color:var(--accent)}
.profileName{font-size:16px;font-weight:600}
.profilePlan{font-size:12px;color:var(--text2);text-align:center}
.enterBtn{width:100%;max-width:400px;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer}
#appShell{display:none;flex-direction:column;min-height:100vh}
.topBar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:0.5px solid var(--border)}
.topBar .logo{font-size:20px;font-weight:700;color:var(--accent)}
.topActions{display:flex;gap:12px;align-items:center}
.iconBtn{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:0.5px solid var(--border);display:flex;z-index:10}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;border:none;background:none;cursor:pointer;color:var(--text2);font-size:10px}
.navBtn.active{color:var(--accent)}
.navBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.cardTitle{font-size:13px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sectionTitle{font-size:20px;font-weight:600;margin-bottom:16px}
.dayChips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.dayChips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text2)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.exerciseItem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer}
.exerciseItem:active{opacity:0.7}
.exerciseItem:last-child{border-bottom:none}
.exNum{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0}
.exInfo{flex:1}
.exName{font-size:15px;font-weight:500}
.exSets{font-size:12px;color:var(--text2);margin-top:2px}
.exArrow{color:var(--text2);font-size:16px}
.startBtn{padding:14px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;width:100%;cursor:pointer;margin-top:4px}
.progressBar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.progressFill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.logRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logLabel{font-size:14px;flex:1}
.logInput{width:64px;padding:7px 8px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;text-align:center}
.logUnit{font-size:12px;color:var(--text2);width:28px}
.saveLogBtn{padding:10px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;width:100%;cursor:pointer;margin-top:6px}
.timerBox{display:flex;align-items:center;gap:12px;background:var(--bg3);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.timerDisplay{font-size:32px;font-weight:300;font-variant-numeric:tabular-nums;flex:1}
.timerBtn{padding:8px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.timerStart{background:var(--accent);color:#fff}
.timerReset{background:var(--bg2);color:var(--text);border:0.5px solid var(--border)}
.weightInput{flex:1;padding:12px;border-radius:12px;border:0.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:16px;width:100%}
.weightForm{display:flex;gap:8px;margin-bottom:16px}
.weightAddBtn{padding:12px 16px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.weightList{display:flex;flex-direction:column;gap:8px}
.weightRow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg3);border-radius:12px}
.weightVal{font-size:18px;font-weight:600}
.weightDate{font-size:12px;color:var(--text2)}
.chartWrap{width:100%;height:180px;position:relative;margin-bottom:16px}
.macroRow{display:flex;gap:8px;margin-bottom:16px}
.macroCard{flex:1;background:var(--bg3);border-radius:14px;padding:12px 8px;text-align:center}
.macroVal{font-size:22px;font-weight:600}
.macroLabel{font-size:11px;color:var(--text2);margin-top:2px}
.mealForm{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.mealInput{padding:11px 14px;border-radius:12px;border:0.5px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px}
.mealRow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg3);border-radius:12px;margin-bottom:6px}
.mealName{font-size:14px;font-weight:500}
.mealCal{font-size:14px;color:var(--accent);font-weight:600}
.delBtn{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px}
.settingRow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:0.5px solid var(--border)}
.settingLabel{font-size:15px}
.toggle{width:44px;height:26px;background:var(--bg3);border-radius:13px;position:relative;cursor:pointer;transition:background .2s;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle.on::after{left:20px}
.colorPicker{display:flex;gap:8px}
.colorDot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.colorDot.selected{border-color:var(--text)}
.photoPickerBtn{padding:8px 14px;background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;cursor:pointer}
.switchProfileBtn{width:100%;padding:14px;background:var(--bg3);border:0.5px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}

/* EXERCISE MODAL */
.modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modalSheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:20px;max-height:85vh;overflow-y:auto}
.modalHandle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:0 auto 16px}
.modalExName{font-size:20px;font-weight:700;margin-bottom:4px}
.modalMuscle{font-size:13px;color:var(--accent);margin-bottom:16px}
.gifWrap{width:100%;border-radius:16px;overflow:hidden;background:var(--bg3);margin-bottom:16px;display:flex;align-items:center;justify-content:center;min-height:200px}
.gifWrap img{width:100%;border-radius:16px}
.formTip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border)}
.formTip:last-child{border-bottom:none}
.tipNum{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.tipText{font-size:14px;line-height:1.5}
.closeModalBtn{width:100%;padding:14px;background:var(--bg3);border:none;border-radius:14px;color:var(--text);font-size:16px;font-weight:600;cursor:pointer;margin-top:16px}
</style>
</head>
<body>

<div id="profileScreen">
  <div class="appTitle">💪 GymPal</div>
  <div class="appSub">Select your profile to continue</div>
  <div class="profiles">
    <div class="profileCard selected" onclick="selectProfile(0)" id="pc0">
      <div class="avatarWrap" id="av0"><span class="avatarInitial" id="ai0">R</span></div>
      <div class="profileName" id="pn0">Rediet</div>
      <div class="profilePlan">5-Day Intermediate</div>
    </div>
    <div class="profileCard" onclick="selectProfile(1)" id="pc1">
      <div class="avatarWrap" id="av1"><span class="avatarInitial" id="ai1">P</span></div>
      <div class="profileName" id="pn1">Partner</div>
      <div class="profilePlan">4-Day Beginner</div>
    </div>
  </div>
  <button class="enterBtn" onclick="enterApp()">Enter App</button>
</div>

<div id="appShell">
  <div class="topBar">
    <div class="logo">💪 GymPal</div>
    <div class="topActions">
      <span id="topProfileName" style="font-size:14px;font-weight:600"></span>
      <button class="iconBtn" onclick="toggleTheme()">☀️</button>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
  <nav class="bottomNav">
    <button class="navBtn active" onclick="showTab('home',this)" id="nb0">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
    </button>
    <button class="navBtn" onclick="showTab('progress',this)" id="nb1">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Progress
    </button>
    <button class="navBtn" onclick="showTab('weight',this)" id="nb2">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Weight
    </button>
    <button class="navBtn" onclick="showTab('nutrition',this)" id="nb3">
      <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>Nutrition
    </button>
    <button class="navBtn" onclick="showTab('settings',this)" id="nb4">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings
    </button>
  </nav>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
<input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

function addExercise(dayIdx){saveDayEdits(dayIdx,true);plan().days[dayIdx].exercises.push({name:'New Exercise',sets:'3',reps:'10'});save();editDay(dayIdx);}

function saveDayEdits(dayIdx,silent=false){
  const d=plan().days[dayIdx];

    </div>`;
  });
  html+=`<button class="saveLogBtn" onclick="saveLog(${idx},${d.exercises.length})">Save Log ✓</button></div>`;
  pc.innerHTML=html;
  renderHistory(pc);
}

function saveLog(dayIdx,count){
  if(!p().logs[dayIdx])p().logs[dayIdx]={};
  for(let ei=0;ei<count;ei++){
    p().logs[dayIdx][ei]={
      sets:document.getElementById(`log_${dayIdx}_${ei}_sets`)?.value||'',
      reps:document.getElementById(`log_${dayIdx}_${ei}_reps`)?.value||'',
      weight:document.getElementById(`log_${dayIdx}_${ei}_weight`)?.value||''
    };
  }
  const wk=getWeekKey(new Date());
  if(!p().history)p().history={};
  if(!p().history[wk])p().history[wk]={};
  if(!p().history[wk][dayIdx])p().history[wk][dayIdx]={};
  const planDays=plan().days;
  for(let ei=0;ei<count;ei++){
    p().history[wk][dayIdx][ei]={
      sets:document.getElementById(`log_${dayIdx}_${ei}_sets`)?.value||'',
      reps:document.getElementById(`log_${dayIdx}_${ei}_reps`)?.value||'',
      weight:document.getElementById(`log_${dayIdx}_${ei}_weight`)?.value||'',
      date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})
    };
  }
  save();
  const btn=document.querySelector('.saveLogBtn');
  if(btn){btn.textContent='Saved! ✓';btn.style.background='#30d158';setTimeout(()=>{btn.textContent='Save Log ✓';btn.style.background=''},1500);}
}

function getWeekKey(date){const d=new Date(date);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}

function renderHistory(c){
  const history=p().history||{};
  const weeks=Object.keys(history).reverse();
  const planDays=plan().days;
  let html=`<div style="margin-top:24px"><div class="sectionTitle" style="font-size:17px">📋 Weekly History</div>`;
  if(!weeks.length){html+=`<div class="card"><div style="text-align:center;color:var(--text2);padding:20px">No history yet — start logging!</div></div>`;}
  else{
    weeks.forEach(wk=>{
      const wkData=history[wk];
      const sessionCount=Object.keys(wkData).length;
      const id='wk_'+wk.replace(/[^a-z0-9]/gi,'_');
      html+=`<div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleWeek('${id}')">
          <div><div style="font-size:15px;font-weight:600">Week of ${wk}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${sessionCount} session${sessionCount!==1?'s':''} logged</div></div>
          <span id="arr_${id}" style="color:var(--text2);font-size:18px">›</span>
        </div>
        <div id="${id}" style="display:none;margin-top:12px">`;
      Object.keys(wkData).forEach(di=>{
        const dayData=wkData[di];
        const dayName=planDays[di]?.name||`Day ${parseInt(di)+1}`;
        const dayDay=planDays[di]?.day||'';
        const exs=planDays[di]?.exercises||[];
        const exIdxs=Object.keys(dayData);
        const sampleDate=dayData[exIdxs[0]]?.date||'';
        html+=`<div style="margin-bottom:12px;padding:10px;background:var(--bg3);border-radius:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:14px;font-weight:600;color:var(--accent)">${dayDay} — ${dayName}</div>
            <div style="font-size:11px;color:var(--text2)">${sampleDate}</div>
          </div>`;
        exIdxs.forEach(ei=>{
          const log=dayData[ei];
          const exName=exs[ei]?.name||`Exercise ${parseInt(ei)+1}`;
          if(log.sets||log.reps||log.weight){
            html+=`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border)">
              <span style="font-size:13px">${exName}</span>
              <span style="font-size:12px;color:var(--text2)">${log.sets||'—'} sets · ${log.reps||'—'} reps · ${log.weight||'—'} lbs</span>
            </div>`;
          }
        });
        html+=`</div>`;
      });
      html+=`</div></div>`;
    });
  }
  html+=`</div>`;
  c.innerHTML+=html;
}

function toggleWeek(id){
  const el=document.getElementById(id);
  const arr=document.getElementById('arr_'+id);
  if(!el)return;
  const open=el.style.display==='block';
  el.style.display=open?'none':'block';
  if(arr)arr.textContent=open?'›':'⌄';
}

// TIMER
function setTimer(v){timerSecs=parseInt(v);resetTimer();}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;const btn=document.getElementById('timerStartBtn');if(btn){btn.textContent='Start';}updateTimerDisplay();}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('timerStartBtn').textContent='Resume';}
  else{timerRunning=true;document.getElementById('timerStartBtn').textContent='Pause';
    timerInterval=setInterval(()=>{timerSecs--;updateTimerDisplay();if(timerSecs<=0){clearInterval(timerInterval);timerRunning=false;document.getElementById('timerStartBtn').textContent='Start';timerSecs=parseInt(document.getElementById('timerSel')?.value||60);updateTimerDisplay();}},1000);
  }
}
function updateTimerDisplay(){const d=document.getElementById('timerDisp');if(d){const m=Math.floor(timerSecs/60);const s=timerSecs%60;d.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}}

}
function addWeight(){const v=parseFloat(document.getElementById('weightVal').value);if(!v)return;const date=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});p().weightLog.push({val:v,date});save();document.getElementById('weightVal').value='';renderWeightList();renderWeightChart();}
function renderWeightList(){const wl=p().weightLog;const el=document.getElementById('weightList');if(!el)return;if(!wl.length){el.innerHTML=`<div style="color:var(--text2);text-align:center;padding:16px">No entries yet</div>`;return;}el.innerHTML=[...wl].reverse().map((w,i)=>`<div class="weightRow"><div><div class="weightVal">${w.val} lbs</div><div class="weightDate">${w.date}</div></div><button class="delBtn" onclick="delWeight(${wl.length-1-i})">✕</button></div>`).join('');}
function delWeight(i){p().weightLog.splice(i,1);save();renderWeightList();renderWeightChart();}
function renderWeightChart(){const wl=p().weightLog;const canvas=document.getElementById('weightChart');if(!canvas)return;if(weightChart){weightChart.destroy();weightChart=null;}if(wl.length<2){canvas.parentElement.innerHTML+=`<div style="text-align:center;color:var(--text2);font-size:13px;padding:8px">Add at least 2 entries to see chart</div>`;return;}const fc=fontColors[p().fontColor]||'#34C759';weightChart=new Chart(canvas,{type:'line',data:{labels:wl.map(w=>w.date),datasets:[{label:'Weight',data:wl.map(w=>w.val),borderColor:fc,backgroundColor:fc+'33',tension:0.3,pointBackgroundColor:fc,fill:true}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#a0a0a0',font:{size:11}}},y:{ticks:{color:'#a0a0a0',font:{size:11}}}}}});}

// NUTRITION
function renderNutrition(c){
  const pr=p();const todayKey=new Date().toDateString();const meals=(pr.meals||[]).filter(m=>m.date===todayKey);const totalCal=meals.reduce((s,m)=>s+m.cal,0);const goal=pr.calGoal||2000;const pct=Math.min(100,Math.round(totalCal/goal*100));
  c.innerHTML=`
    <div class="sectionTitle">Nutrition</div>
    <div class="card"><div class="cardTitle">Calorie Goals</div>
      <div style="display:flex;gap:8px;margin-bottom:8px"><input class="weightInput" type="number" id="calGoalInput" value="${pr.calGoal||2000}" placeholder="Workout day"><button class="weightAddBtn" onclick="saveCalGoal()">Set</button></div>
      <div style="font-size:12px;color:var(--text2)">Rest day: <input type="number" id="calGoalRest" value="${pr.calGoalRest||1600}" style="width:70px;background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:4px 6px;color:var(--text);font-size:12px"> kcal</div>
    </div>
    <div class="card"><div class="cardTitle">Today</div>
      <div class="macroRow">
        <div class="macroCard"><div class="macroVal">${totalCal}</div><div class="macroLabel">Consumed</div></div>
        <div class="macroCard"><div class="macroVal">${goal}</div><div class="macroLabel">Goal</div></div>
        <div class="macroCard"><div class="macroVal">${Math.max(0,goal-totalCal)}</div><div class="macroLabel">Remaining</div></div>
      </div>
      <div class="progressBar"><div class="progressFill" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--text2);text-align:right">${pct}% of goal</div>
    </div>
    <div class="card"><div class="cardTitle">Log a Meal</div>
      <div class="mealForm">
        <input class="mealInput" id="mealName" placeholder="Meal name">
        <input class="mealInput" type="number" id="mealCal" placeholder="Calories">
        <button class="saveLogBtn" onclick="addMeal()">Add Meal</button>
      </div>
    </div>
    <div class="card"><div class="cardTitle">Today's Meals</div><div id="mealList"></div></div>`;
  renderMealList(todayKey);
}
function saveCalGoal(){p().calGoal=parseInt(document.getElementById('calGoalInput').value)||2000;p().calGoalRest=parseInt(document.getElementById('calGoalRest').value)||1600;save();renderNutrition(document.getElementById('mainContent'));}
function addMeal(){const n=document.getElementById('mealName').value.trim();const cal=parseInt(document.getElementById('mealCal').value);if(!n||!cal)return;const todayKey=new Date().toDateString();if(!p().meals)p().meals=[];p().meals.push({name:n,cal,date:todayKey});save();renderNutrition(document.getElementById('mainContent'));}
function delMeal(i){p().meals.splice(i,1);save();renderNutrition(document.getElementById('mainContent'));}
function renderMealList(todayKey){const el=document.getElementById('mealList');if(!el)return;const meals=(p().meals||[]).map((m,i)=>({...m,i})).filter(m=>m.date===todayKey);if(!meals.length){el.innerHTML=`<div style="color:var(--text2);text-align:center;padding:12px">No meals logged today</div>`;return;}el.innerHTML=meals.map(m=>`<div class="mealRow"><div class="mealName">${m.name}</div><div style="display:flex;align-items:center;gap:8px"><span class="mealCal">${m.cal} kcal</span><button class="delBtn" onclick="delMeal(${m.i})">✕</button></div></div>`).join('');}

// SETTINGS
function renderSettings(c){
  const pr=p();
  c.innerHTML=`
    <div class="sectionTitle">Settings</div>
    <div class="card"><div class="cardTitle">Profile</div>
      <div class="settingRow"><span class="settingLabel">Name</span><input id="settingName" value="${pr.name}" style="background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:14px;width:130px;text-align:right"></div>
      <div class="settingRow"><span class="settingLabel">Profile Photo</span><button class="photoPickerBtn" onclick="document.getElementById('photoInput').click()">Choose Photo</button></div>
      ${pr.photo?`<div style="margin-top:8px;text-align:center"><img src="${pr.photo}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)"></div>`:''}
      <button class="saveLogBtn" style="margin-top:12px" onclick="saveName()">Save Name</button>
    </div>
    <div class="card"><div class="cardTitle">Font Color</div>
      <div class="colorPicker">${Object.entries(fontColors).map(([k,v])=>`<div class="colorDot${pr.fontColor===k?' selected':''}" style="background:${v}" onclick="setFontColor('${k}')"></div>`).join('')}</div>
    </div>
    <div class="card"><div class="cardTitle">Appearance</div>
      <div class="settingRow"><span class="settingLabel">Dark Mode</span><button class="toggle${pr.darkMode?' on':''}" id="darkToggle" onclick="toggleTheme();this.classList.toggle('on')"></button></div>
    </div>
    <div class="card"><div class="cardTitle">Account</div><button class="switchProfileBtn" onclick="switchProfile()">⇄ Switch Profile</button></div>
    <div class="card"><div class="cardTitle">Backup & Restore</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">Export your data to backup or transfer to a new phone</div>
      <button class="saveLogBtn" style="margin-bottom:10px" onclick="exportData()">📤 Export My Data</button>
      <button class="saveLogBtn" style="background:var(--bg3);color:var(--text);border:0.5px solid var(--border)" onclick="document.getElementById('importInput').click()">📥 Import Data</button>
      <div id="importMsg" style="font-size:13px;color:var(--accent);margin-top:8px;text-align:center"></div>
    </div>`;
}

function saveName(){const v=document.getElementById('settingName').value.trim();if(v){p().name=v;save();document.getElementById('topProfileName').textContent=v;}}
function setFontColor(k){p().fontColor=k;save();applyThemeAndFont();document.querySelectorAll('.colorDot').forEach(d=>d.classList.remove('selected'));event.target.classList.add('selected');}
function handlePhoto(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{p().photo=r.result;save();renderSettings(document.getElementById('mainContent'));};r.readAsDataURL(file);}
function exportData(){const data=JSON.stringify(profiles,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`gympal_backup_${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).replace(/,?\s/g,'_')}.json`;a.click();URL.revokeObjectURL(url);}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!Array.isArray(imported))throw new Error('Invalid');profiles=imported;save();const msg=document.getElementById('importMsg');if(msg)msg.textContent='✅ Imported!';setTimeout(()=>switchProfile(),1500);}catch(err){const msg=document.getElementById('importMsg');if(msg){msg.textContent='❌ Invalid file';msg.style.color='#FF3B30';}}};r.readAsText(file);}
function switchProfile(){document.getElementById('appShell').style.display='none';document.getElementById('profileScreen').style.display='flex';selectProfile(currentProfile);}

window.onload=()=>{
  selectProfile(0);
  profiles.forEach((pr,j)=>{
    const av=document.getElementById('av'+j);
    if(pr.photo){av.innerHTML=`<img src="${pr.photo}">`;}
    else{av.innerHTML=`<span class="avatarInitial" style="color:${fontColors[pr.fontColor]||'#34C759'}">${pr.name.charAt(0).toUpperCase()}</span>`;}
    document.getElementById('pn'+j).textContent=pr.name;
  });
};
</script>
</body>
</html>
